name: VibeLoad Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build & Package Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Compute SHA-256 Checksum
        id: checksum
        run: |
          APK_PATH=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "SHA256 Checksum: $SHA256"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          prerelease: false
          name: "VibeLoad ${{ github.ref_name }}"
          body: |
            ## VibeLoad Phiên bản ${{ github.ref_name }}
            
            ### SHA-256 Checksum:
            `${{ steps.checksum.outputs.sha256 }}`
            
            ### Điểm nổi bật:
            - 100% On-Device, không server backend trung gian.
            - Hỗ trợ tải Video MP4 và Âm thanh MP3 chất lượng cao.
            - Phân tích và tải trực tiếp từ 5 nền tảng: YouTube, TikTok, Facebook, Instagram, SoundCloud.
            - Hỗ trợ tải nền qua Android Foreground Service.
            - Thư viện quản lý tệp và Trình phát tích hợp (Media3 ExoPlayer).
          files: |
            ${{ steps.checksum.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
